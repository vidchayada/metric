plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.5.0.8588"
    id 'org.cadixdev.licenser' version '0.6.1'
    id "jacoco"
}

// Apply the java plugin to add support for Java
apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    main {
        java {
            srcDirs = ['backend/src/main/java']
        }
        resources {
            srcDirs = ['backend/src/main/resources']
        }
    }

    test {
        java {
            srcDirs = ['backend/src/test/java']
        }
        resources {
            srcDirs = ['backend/src/test/resources']
        }
    }
}

configurations {
    checkstyleConfig
}

// Apply the checkstyle plugin
apply plugin: 'checkstyle'
checkstyle {
    toolVersion = '10.21.4'
    config = resources.text.fromArchiveEntry(configurations.checkstyleConfig, 'google_checks.xml')
    maxErrors = 0
    maxWarnings = 0
}

sonarqube {
    properties {
        property "sonar.sources", "backend/src/main/java"
        property "sonar.tests", "backend/src/test/java"
        property "sonar.projectKey", "vidchayada_metric"
        property "sonar.organization", "vidchayada"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}


tasks.named('sonar') {
    dependsOn jacocoTestReport
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}


// In this section you declare the dependencies for your production and test code
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    checkstyleConfig dependencies.create("com.puppycrawl.tools:checkstyle:${checkstyle.toolVersion}") {
        transitive = false
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

license {
    header = file('HEADER.txt')
    include '**/*.java'
    exclude '**/*.properties'
}